[request_definition]
# 请求的参数：角色/用户, 路由路径, 请求方法
r = sub, obj, act

[policy_definition]
# 策略的参数：角色/用户, 路由路径, 请求方法
p = sub, obj, act

[role_definition]
# 角色的继承关系：g(用户, 角色) 表示用户属于某个角色
g = _, _

[policy_effect]
# 只要有一个策略允许，就放行
e = some(where (p.eft == allow))

[matchers]
m = (r.sub == p.sub || g(r.sub, p.sub)) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*") || r.sub == "root"