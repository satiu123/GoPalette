server:
  addr: ":8080"
  env: "development"
jwt:
  access_token_secret: "change-me-access"
  refresh_token_secret: "change-me-refresh"
  access_token_ttl: 15m
  refresh_token_ttl: 168h
database:
  dsn: ""
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
attachment:
  cleanup_spec: "@every 1h"
  temp_ttl_hours: 24