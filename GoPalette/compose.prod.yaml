x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  # nginx:
  #   image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-nginx:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
  #   restart: always
  #   depends_on:
  #     - frontend
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - "${NGINX_CERT_DIR:?请设置 NGINX_CERT_DIR，例如 /etc/letsencrypt}:/etc/nginx/certs:ro"

  frontend:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-frontend:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      NUXT_GATEWAY_BASE: "http://gateway:8080"
      NUXT_PUBLIC_SITE_URL: "${NUXT_PUBLIC_SITE_URL:?请设置 NUXT_PUBLIC_SITE_URL，例如 https://example.com}"
      NUXT_PUBLIC_SITE_NAME: "${NUXT_PUBLIC_SITE_NAME:?请设置 NUXT_PUBLIC_SITE_NAME，例如 GoPalette Blog}"
      NITRO_CSURF_HTTPS: "${NITRO_CSURF_HTTPS:?请设置 NITRO_CSURF_HTTPS，例如 true}"
      NITRO_CSURF_COOKIE_KEY: "${NITRO_CSURF_COOKIE_KEY:?请设置 NITRO_CSURF_COOKIE_KEY，例如 csrf}"
      NITRO_CSURF_COOKIE_SECURE: "${NITRO_CSURF_COOKIE_SECURE:?请设置 NITRO_CSURF_COOKIE_SECURE，例如 true}"
      NITRO_AUTH_COOKIE_SECURE: "${NITRO_AUTH_COOKIE_SECURE:?请设置 NITRO_AUTH_COOKIE_SECURE，例如 true}"
    depends_on:
      - gateway
    ports:
      - "3001:3000"
    logging: *default-logging

  gateway:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-gateway:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    command: [ "./server", "-conf", "/data/conf/config.yaml", "-discovery.dsn", "etcd:2379" ]
    environment:
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    restart: always
    depends_on:
      - user
      - post
      - comment
      - search
      - bff
      - etcd
    ports:
      - "8080:8080"
    logging: *default-logging

  user:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-user:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "gopalette_user"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging

  post:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-post:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "gopalette_post"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging

  comment:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-comment:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "gopalette_comment"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging

  search:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-search:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      MEILISEARCH_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - meilisearch
      - redis
    logging: *default-logging

  bff:
    image: ${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE，例如 satiu}/gopalette-bff:${IMAGE_TAG:?请设置 IMAGE_TAG，例如 latest}
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - user
      - post
      - comment
      - etcd
    logging: *default-logging

  mariadb:
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: "gopalette_user"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    logging: *default-logging

  redis:
    image: redis:trixie
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    logging: *default-logging

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: always
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
      - "4318:4318"
    environment:
      - LOG_LEVEL=debug
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.2
    restart: always
    command: [ "-config.file=/etc/loki/config.yaml" ]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.16.3
    restart: always
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      GOPALETTE_LOGS_PROJECT: "${GOPALETTE_LOGS_PROJECT:-gopalette}"
      GOPALETTE_LOGS_ENVIRONMENT: "${GOPALETTE_LOGS_ENVIRONMENT:-prod}"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "12345:12345"
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    restart: always
    command: meilisearch --master-key="${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    logging: *default-logging

  etcd:
    image: quay.io/coreos/etcd:v3.6.10
    restart: always
    volumes:
      - etcd_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=tkn
      - --initial-cluster-state=new
      - --log-level=info
      - --logger=zap
      - --log-outputs=stderr
    ports:
      - "2379:2379"
      - "2380:2380"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - node-exporter
      - loki
      - alloy
    ports:
      - "9091:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.0.1
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev:/dev:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    logging: *default-logging

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  mariadb_data:
  meili_data:
  etcd_data:
