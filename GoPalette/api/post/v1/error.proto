syntax = "proto3";

package api.post.v1;
import "errors/errors.proto";
option go_package = "github.com/satiu123/GoPalette/api/post/v1;v1";
option java_multiple_files = true;
option java_package = "api.post.v1";

enum ErrorReason {
  option (errors.default_code) = 500;

  // 文章未找到
  POST_NOT_FOUND = 0 [(errors.code) = 404];
  // 参数无效
  INVALID_ARGUMENT = 1 [(errors.code) = 400];
  // 未认证
  UNAUTHENTICATED = 2 [(errors.code) = 401];
  // SLUG 已存在
  SLUG_CONFLICT = 3 [(errors.code) = 409];
  
  // 访问被拒绝
  ACCESS_DENIED = 4 [(errors.code) = 403];

  // 分类未找到
  CATEGORY_NOT_FOUND = 5 [(errors.code) = 404];

  // 标签未找到
  TAG_NOT_FOUND = 6 [(errors.code) = 404];
}
