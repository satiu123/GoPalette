syntax = "proto3";

package api.comment.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "GoPalette/api/comment/v1;v1";
option java_multiple_files = true;
option java_package = "api.comment.v1";

enum CommentStatus {
  COMMENT_STATUS_UNSPECIFIED = 0;
  COMMENT_STATUS_NORMAL = 1;
  COMMENT_STATUS_PENDING = 2;
  COMMENT_STATUS_DELETED = 3;
}

// 评论管理服务
service Comment {
  // 发表评论/回复
  rpc CreateComment (CreateCommentRequest) returns (CommentInfo) {
    option (google.api.http) = {
      post: "/v1/comments"
      body: "*"
    };
  }

  // 拉取文章评论列表（按一级评论分页，附带二级回复）
  rpc ListComments (ListCommentsRequest) returns (ListCommentsReply) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/comments"
    };
  }

  // 删除评论
  rpc DeleteComment (DeleteCommentRequest) returns (DeleteCommentReply) {
    option (google.api.http) = {
      delete: "/v1/comments/{id}"
    };
  }
}

message AuthorInfo {
  int64  id         = 1;
  string name       = 2;
  string avatar_url = 3;
}

message CommentInfo {
  int64                     id              = 1;
  int64                     post_id         = 2;
  int64                     user_id         = 3;
  string                    content         = 4;
  int64                     parent_id       = 5;
  int64                     root_id         = 6;
  int64                     like_count      = 7;
  CommentStatus             status          = 8;
  AuthorInfo                author          = 9;
  AuthorInfo                reply_to_author = 10;
  google.protobuf.Timestamp created_at      = 11;
  google.protobuf.Timestamp updated_at      = 12;
  repeated CommentInfo      replies         = 13;
}

message CreateCommentRequest {
  int64  post_id   = 1;
  string content   = 2;
  int64  parent_id = 3;
}

message ListCommentsRequest {
  int64 post_id   = 1;
  int64 page      = 2;
  int64 page_size = 3;
}

message ListCommentsReply {
  repeated CommentInfo comments = 1;
  int64                total    = 2;
}

message DeleteCommentRequest {
  int64 id = 1;
}

message DeleteCommentReply {
  bool success = 1;
}
