syntax = "proto3";

package api.search.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/satiu123/GoPalette/api/search/v1;v1";
option java_multiple_files = true;
option java_package = "api.search.v1";

// Search 服务负责查询与索引投影同步。
service Search {
	// 对外搜索接口
	rpc SearchPosts (SearchPostsRequest) returns (SearchPostsReply) {
		option (google.api.http) = {
			get: "/v1/search/posts"
		};
	}

	// 内部同步接口（由 Post Service 调用）
	rpc SyncPost (SyncPostRequest) returns (SyncPostReply);

	// 删除索引文档（按 post_id）
	rpc DeleteIndex (DeleteIndexRequest) returns (DeleteIndexReply);

	// 管理员触发：从 Post Service 拉取全量并重建索引
	rpc RebuildIndex (RebuildIndexRequest) returns (RebuildIndexReply){
		option (google.api.http) = {
			post: "/v1/search/rebuild"
			body: "*"
		};
	}

	// 查询异步重建任务状态，不传 task_id 返回最近一次任务状态
	rpc GetRebuildStatus (GetRebuildStatusRequest) returns (GetRebuildStatusReply) {
		option (google.api.http) = {
			get: "/v1/search/rebuild/status"
			additional_bindings {
				get: "/v1/search/rebuild/{task_id}"
			}
		};
	}
}

message SearchPostsRequest {
	string query = 1;
	int64 page = 2;
	int64 page_size = 3;
	string category = 4;
}

message PostSearchInfo {
	int64 id = 1;
	string title = 2;
	string summary = 3;
	string slug = 4;
	string category_name = 5;
	repeated string tags = 6;
	google.protobuf.Timestamp created_at = 7;
}

message SearchPostsReply {
	repeated PostSearchInfo results = 1;
	int64 total = 2;
	int64 total_pages = 3;
}

message SyncPostRequest {
	int64 id = 1;
	string title = 2;
	string summary = 3;
	string content = 4;
	string slug = 5;
	string category_name = 6;
	repeated string tags = 7;
	google.protobuf.Timestamp created_at = 8;
}

message SyncPostReply {
	bool success = 1;
}

message DeleteIndexRequest {
	int64 post_id = 1;
}

message DeleteIndexReply {
	bool success = 1;
}

message RebuildIndexRequest {
	bool reset_first = 1;
	bool include_non_published = 2;
}

message RebuildIndexReply {
	bool accepted = 1;
	RebuildTaskInfo task = 2;
}

message GetRebuildStatusRequest {
	string task_id = 1;
}

message GetRebuildStatusReply {
	RebuildTaskInfo task = 1;
}

message RebuildTaskInfo {
	string task_id = 1;
	string status = 2;
	bool reset_first = 3;
	bool include_non_published = 4;
	int64 indexed_count = 5;
	int64 total = 6;
	string error_message = 7;
	google.protobuf.Timestamp started_at = 8;
	google.protobuf.Timestamp finished_at = 9;
}
