proxy_cache_path /var/cache/nginx/nuxt-swr
    levels=1:2
    keys_zone=nuxt_swr:100m
    max_size=1g
    inactive=30m
    use_temp_path=off;

map $request_method $swr_cacheable_method {
    default 0;
    GET 1;
    HEAD 1;
}

map $http_cookie $swr_has_session {
    default 0;
    ~*(gopalette_access_token|gopalette_refresh_token|gopalette_logged_in|gopalette_user_id|csrf|__Host-csrf) 1;
}

map $uri $swr_private_route {
    default 0;
    ~^/(login|register)(/|$) 1;
    ~^/(admin|profile|write)(/|$) 1;
    ~^/api/ 1;
}

map $arg_nocache $swr_has_nocache_arg {
    default 0;
    ~.+ 1;
}

map "$swr_cacheable_method$swr_has_session$swr_private_route$swr_has_nocache_arg" $swr_skip_cache {
    default 1;
    "1000" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name satiuu.com www.satiuu.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name satiuu.com www.satiuu.com;

    ssl_certificate /etc/nginx/certs/satiuu.com.pem;
    ssl_certificate_key /etc/nginx/certs/satiuu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $nuxt_upstream http://frontend:3000;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location /_nuxt/ {
        proxy_pass $nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache nuxt_swr;
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass $nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass $nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache nuxt_swr;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        proxy_cache_bypass $swr_skip_cache $http_cache_control $http_pragma;
        proxy_no_cache $swr_skip_cache $upstream_http_set_cookie;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
