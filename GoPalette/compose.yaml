  #   volumes:
  #     - "${NGINX_CERT_DIR:-./certs}:/etc/nginx/certs:ro"
  #   logging: &default-logging
  #     driver: json-file
  #     options:
  #       max-size: "100m"
  #       max-file: "3"

  frontend:
    build:
      context: ..
      dockerfile: GoPalette/nginx/Dockerfile
      target: frontend-runtime
    restart: unless-stopped
    environment:
      NUXT_GATEWAY_BASE: "http://gateway:8080"
      NUXT_PUBLIC_SITE_URL: "${NUXT_PUBLIC_SITE_URL:-http://localhost}"
      NUXT_PUBLIC_SITE_NAME: "${NUXT_PUBLIC_SITE_NAME:-GoPalette Blog}"
      NITRO_CSURF_HTTPS: "${NITRO_CSURF_HTTPS:-true}"
      NITRO_CSURF_COOKIE_KEY: "${NITRO_CSURF_COOKIE_KEY:-csrf}"
      NITRO_CSURF_COOKIE_SECURE: "${NITRO_CSURF_COOKIE_SECURE:-true}"
      NITRO_AUTH_COOKIE_SECURE: "${NITRO_AUTH_COOKIE_SECURE:-true}"
      NUXT_DEEPSEEK_API_KEY: "${NUXT_DEEPSEEK_API_KEY}"
    depends_on:
      - gateway
    ports:
      - "3001:3000"
    logging: &default-logging
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/gateway/service
        - HTTP_PORT=8080
    command: [ "./server", "-conf", "/data/conf/config.yaml", "-discovery.dsn", "etcd:2379" ]
    restart: unless-stopped
    environment:
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8080:8080"
    logging: *default-logging

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/user/service
        - HTTP_PORT=8000
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging
    ports:
      - "8000:8000"
      - "9000:9000" # gRPC 端口

  post:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/post/service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging
    ports:
      - "8001:8001" # HTTP 端口
      - "9001:9001" # gRPC 端口

  comment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/comment/service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis
    logging: *default-logging
    ports:
      - "8002:8002" # HTTP 端口
      - "9002:9002" # gRPC 端口
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/search/service
    restart: unless-stopped
    environment:
      MEILISEARCH_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - meilisearch
    logging: *default-logging
    ports:
      - "8003:8003" # HTTP 端口
      - "9003:9003" # gRPC 端口

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/bff/service
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - user
      - post
      - comment
      - etcd
    logging: *default-logging

  mariadb:
    image: mariadb:12.2.2
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: "gopalette"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    logging: *default-logging

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "9104:9104"
    logging: *default-logging

  redis:
    image: redis:trixie
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    logging: *default-logging

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    restart: unless-stopped
    command: meilisearch --master-key="${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    logging: *default-logging

  etcd:
    image: quay.io/coreos/etcd:v3.6.10
    restart: unless-stopped
    volumes:
      - etcd_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=tkn
      - --initial-cluster-state=new
      - --log-level=info
    ports:
      - "2379:2379"
      - "2380:2380"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - node-exporter
      - mariadb-exporter
    ports:
      - "9091:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    logging: *default-logging

volumes:
  prometheus_data:
  grafana_data:
  mariadb_data:
  meili_data:
  etcd_data:
