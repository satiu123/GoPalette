services:
  nginx:
    build:
      context: ..
      dockerfile: GoPalette/nginx/Dockerfile
      target: nginx
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "${NGINX_CERT_DIR:-/etc/nginx/certs}:/etc/nginx/certs:ro"

  frontend:
    build:
      context: ..
      dockerfile: GoPalette/nginx/Dockerfile
      target: frontend-runtime
    restart: always
    environment:
      NUXT_GATEWAY_BASE: "http://gateway:8080"
      NUXT_PUBLIC_SITE_URL: "${NUXT_PUBLIC_SITE_URL:-http://localhost}"
      NUXT_PUBLIC_SITE_NAME: "${NUXT_PUBLIC_SITE_NAME:-GoPalette Blog}"
      NITRO_CSURF_HTTPS: "${NITRO_CSURF_HTTPS:-true}"
      NITRO_CSURF_COOKIE_KEY: "${NITRO_CSURF_COOKIE_KEY:-csrf}"
      NITRO_CSURF_COOKIE_SECURE: "${NITRO_CSURF_COOKIE_SECURE:-true}"
      NITRO_AUTH_COOKIE_SECURE: "${NITRO_AUTH_COOKIE_SECURE:-true}"
      NUXT_DEEPSEEK_API_KEY: "${NUXT_DEEPSEEK_API_KEY}"
    depends_on:
      - gateway
    ports:
      - "3001:3000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/gateway/service
        - HTTP_PORT=8080
    command: [ "./server", "-conf", "/data/conf/config.yaml", "-discovery.dsn", "etcd:2379" ]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/gateway/service/cmd/server/config.yaml:/data/conf/config.yaml
    restart: always
    ports:
      - "8080:8080"
  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/user/service
        - HTTP_PORT=8000
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/user/service/configs:/data/conf
    depends_on:
      - mariadb
      - redis
  post:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/post/service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/post/service/configs:/data/conf
    depends_on:
      - mariadb
      - redis
  comment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/comment/service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/comment/service/configs:/data/conf
    depends_on:
      - mariadb
      - redis
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/search/service
    restart: always
    environment:
      MEILISEARCH_MASTER_KEY: "${MEILISEARCH_MASTER_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/search/service/configs:/data/conf
    depends_on:
      - meilisearch
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/bff/service
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - ./app/bff/service/configs:/data/conf
    depends_on:
      - user
      - post
      - comment
      - etcd
  mariadb:
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: "gopalette"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  redis:
    image: redis:trixie
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: always
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
      - "4318:4318"
    environment:
      - LOG_LEVEL=debug
  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    restart: always
    command: meilisearch --master-key="${MEILISEARCH_MASTER_KEY}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "7700:7700"
    volumes:
      - /meili_data:/meili_data
  etcd:
    image: quay.io/coreos/etcd:v3.6.10
    restart: always
    volumes:
      - /etcd_data:/etcd_data
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=tkn
      - --initial-cluster-state=new
      - --log-level=info
      - --logger=zap
      - --log-outputs=stderr

    ports:
      - "2379:2379" # 客户端通信端口
      - "2380:2380" # 集群通信端口
  prometheus:
    image: prom/prometheus:v3
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - node-exporter
    ports:
      - "9091:9090"
  grafana:
    image: grafana/grafana:13.0.1
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

volumes:
  prometheus_data:
  grafana_data:
  mariadb_data:
