syntax = "proto3";
package kratos.api.search;

option go_package = "github.com/satiu123/GoPalette/app/search/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Meilisearch {
    string endpoint = 1;
    string api_key = 2;
    string index_name = 3;
  }
  message Redis {
    string                   network       = 1;
    string                   addr          = 2;
    string                   password      = 3;
    int32                    db            = 4;
    google.protobuf.Duration dial_timeout  = 5;
    google.protobuf.Duration read_timeout  = 6;
    google.protobuf.Duration write_timeout = 7;
  }
  message Clients {
    string post_endpoint = 1;
    google.protobuf.Duration timeout = 2;
  }
  Meilisearch meilisearch = 1;
  Clients clients = 2;
  Redis redis = 3;
  Redis event_redis = 4;
}

message Registry {
  message Etcd {
    repeated string endpoints = 1;
    google.protobuf.Duration timeout = 2;
  }
  Etcd etcd = 1;
}
