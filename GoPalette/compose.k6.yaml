services:
  nginx:
    build:
      context: ..
      dockerfile: GoPalette/nginx/Dockerfile
      target: nginx
    restart: always
    depends_on:
      - frontend
    ports:
      - "180:80"
      - "1443:443"
    volumes:
      - "${NGINX_CERT_DIR:-/etc/nginx/certs}:/etc/nginx/certs:ro"

  frontend:
    build:
      context: ..
      dockerfile: GoPalette/nginx/Dockerfile
      target: frontend-runtime
    restart: always
    environment:
      NUXT_GATEWAY_BASE: "http://gateway:8080"
      NUXT_PUBLIC_SITE_URL: "${NUXT_PUBLIC_SITE_URL:-http://localhost:13001}"
      NUXT_PUBLIC_SITE_NAME: "${NUXT_PUBLIC_SITE_NAME:-GoPalette Blog K6}"
      NITRO_CSURF_HTTPS: "${NITRO_CSURF_HTTPS:-false}"
      NITRO_CSURF_COOKIE_KEY: "${NITRO_CSURF_COOKIE_KEY:-csrf_k6}"
      NITRO_CSURF_COOKIE_SECURE: "${NITRO_CSURF_COOKIE_SECURE:-false}"
      NITRO_AUTH_COOKIE_SECURE: "${NITRO_AUTH_COOKIE_SECURE:-false}"
      NUXT_DEEPSEEK_API_KEY: "${NUXT_DEEPSEEK_API_KEY}"
    depends_on:
      - gateway
    ports:
      - "13001:3000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/gateway/service
        - HTTP_PORT=8080
    command: [ "./server", "-conf", "/data/conf/config.yaml", "-discovery.dsn", "etcd:2379" ]
    environment:
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    restart: always
    ports:
      - "18080:8080"

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/user/service
        - HTTP_PORT=8000
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gopalette_k6}"
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-80}"
      MYSQL_MAX_IDLE_CONNS: "${MYSQL_MAX_IDLE_CONNS:-40}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis

  post:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/post/service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gopalette_k6}"
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-80}"
      MYSQL_MAX_IDLE_CONNS: "${MYSQL_MAX_IDLE_CONNS:-40}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis

  comment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/comment/service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gopalette_k6}"
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-80}"
      MYSQL_MAX_IDLE_CONNS: "${MYSQL_MAX_IDLE_CONNS:-40}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - mariadb
      - redis

  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/search/service
    restart: always
    environment:
      MEILISEARCH_MASTER_KEY: "${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - meilisearch

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_RELATIVE_PATH=app/bff/service
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      - user
      - post
      - comment
      - etcd

  seed-k6-data:
    image: mariadb
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      post:
        condition: service_started
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gopalette_k6}"
      K6_CATEGORY_NAME: "${K6_CATEGORY_NAME:-K6 Load Test}"
      K6_CATEGORY_SLUG: "${K6_CATEGORY_SLUG:-k6-load-test}"
    command:
      - /bin/sh
      - -c
      - |
        until mariadb -hmariadb -uroot -p"$${MYSQL_ROOT_PASSWORD}" "$${MYSQL_DATABASE}" -e "SHOW TABLES LIKE 'categories'" | grep -q categories; do
          echo "waiting for post service to migrate categories table..."
          sleep 2
        done
        mariadb -hmariadb -uroot -p"$${MYSQL_ROOT_PASSWORD}" "$${MYSQL_DATABASE}" -e "
          INSERT INTO categories (name, slug, description, post_count, created_at, updated_at)
          VALUES ('$${K6_CATEGORY_NAME}', '$${K6_CATEGORY_SLUG}', 'Category reserved for isolated k6 write tests', 0, NOW(), NOW())
          ON DUPLICATE KEY UPDATE updated_at = VALUES(updated_at);
        "

  mariadb:
    image: mariadb
    command:
      - mariadbd
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-600}
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-512M}
    volumes:
      - mariadb_k6_data:/var/lib/mysql
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MYSQL_DATABASE:-gopalette_k6}"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "13306:3306"

  redis:
    image: redis:trixie
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "16379:6379"
    volumes:
      - redis_k6_data:/data

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: always
    ports:
      - "16696:16686"
      - "16697:16687"
      - "14317:4317"
      - "14318:4318"
    environment:
      - LOG_LEVEL=debug

  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    restart: always
    command: meilisearch --master-key="${MEILISEARCH_MASTER_KEY:?请设置 MEILISEARCH_MASTER_KEY}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "17700:7700"
    volumes:
      - meilisearch_k6_data:/meili_data

  etcd:
    image: quay.io/coreos/etcd:v3.6.10
    restart: always
    volumes:
      - etcd_k6_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=tkn
      - --initial-cluster-state=new
      - --log-level=info
      - --logger=zap
      - --log-outputs=stderr
    ports:
      - "12379:2379"
      - "12380:2380"

  prometheus:
    image: prom/prometheus:v3
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_k6_data:/prometheus
    depends_on:
      - cadvisor
      - node-exporter
    ports:
      - "19091:9090"

  grafana:
    image: grafana/grafana:13.0.1
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_k6_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "13000:3000"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "18081:8080"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "19100:9100"

volumes:
  mariadb_k6_data:
  redis_k6_data:
  meilisearch_k6_data:
  etcd_k6_data:
  prometheus_k6_data:
  grafana_k6_data:
