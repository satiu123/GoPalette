global:
  scrape_interval: 5s
  external_labels:
    monitor: "gopalette-monitor"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "mariadb-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["mariadb-exporter:9104"]
  - job_name: "loki"
    scrape_interval: 5s
    static_configs:
      - targets: ["loki:3100"]
  - job_name: "alloy"
    scrape_interval: 5s
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: "gopalette-services"
    scrape_interval: 5s
    static_configs:
      - targets: ["gateway:8080", "user:8000", "post:8001", "comment:8002", "search:8003"]
