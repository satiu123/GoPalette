name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      push:
        description: Push images to Docker Hub.
        required: false
        type: boolean
        default: false
      images:
        description: Images to build: all, backend, web, frontend, nginx, or backend service names separated by commas.
        required: false
        type: string
        default: all
      image_tag:
        description: Optional Docker image tag to publish, for example v1.0.4.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      push:
        description: Push images to Docker Hub.
        required: false
        type: boolean
        default: false
      images:
        description: Images to build: all, backend, web, frontend, nginx, or backend service names separated by commas.
        required: false
        type: string
        default: frontend
      image_tag:
        description: Optional Docker image tag to publish, for example v1.0.4.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}

jobs:
  prepare-matrix:
    name: Prepare image matrix
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.matrix.outputs.backend }}
      web: ${{ steps.matrix.outputs.web }}
      has_backend: ${{ steps.matrix.outputs.has_backend }}
      has_web: ${{ steps.matrix.outputs.has_web }}

    steps:
      - name: Build selected matrices
        id: matrix
        env:
          IMAGE_FILTER: ${{ github.event_name == 'push' && 'all' || inputs.images }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const services = [
            { name: 'user', path: 'app/user/service', http_port: '8000', grpc_port: '9000' },
            { name: 'post', path: 'app/post/service', http_port: '8001', grpc_port: '9001' },
            { name: 'comment', path: 'app/comment/service', http_port: '8002', grpc_port: '9002' },
            { name: 'search', path: 'app/search/service', http_port: '8003', grpc_port: '9003' },
            { name: 'bff', path: 'app/bff/service', http_port: '8004', grpc_port: '9004' },
            { name: 'gateway', path: 'app/gateway/service', http_port: '8080', grpc_port: '0' }
          ]
          const webImages = [
            { name: 'frontend', target: 'frontend-runtime' },
            { name: 'nginx', target: 'nginx' }
          ]

          const filters = new Set(
            (process.env.IMAGE_FILTER || 'all')
              .split(',')
              .map(item => item.trim().toLowerCase())
              .filter(Boolean)
          )
          const all = filters.has('all')
          const backendAll = all || filters.has('backend')
          const webAll = all || filters.has('web')

          const backend = services.filter(service => backendAll || filters.has(service.name))
          const web = webImages.filter(image => webAll || filters.has(image.name))

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `backend=${JSON.stringify({ service: backend })}`,
            `web=${JSON.stringify({ image: web })}`,
            `has_backend=${backend.length > 0}`,
            `has_web=${web.length > 0}`
          ].join('\n') + '\n')
          NODE

  backend-images:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.backend) }}

    name: Backend image / ${{ matrix.service.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub secrets
        if: ${{ github.event_name == 'push' || inputs.push }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required when push is enabled." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/gopalette-${{ matrix.service.name }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name != 'push' && inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: GoPalette
          file: GoPalette/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push }}
          build-args: |
            APP_RELATIVE_PATH=${{ matrix.service.path }}
            HTTP_PORT=${{ matrix.service.http_port }}
            GRPC_PORT=${{ matrix.service.grpc_port }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-images:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.web) }}

    name: Web image / ${{ matrix.image.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub secrets
        if: ${{ github.event_name == 'push' || inputs.push }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required when push is enabled." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/gopalette-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name != 'push' && inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: GoPalette/nginx/Dockerfile
          target: ${{ matrix.image.target }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
