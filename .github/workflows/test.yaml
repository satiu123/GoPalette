name: test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GoPalette

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: GoPalette/go.work
          cache-dependency-path: |
            GoPalette/**/go.sum

      - name: Test workspace
        run: go test work
