basePath: /api
definitions:
  handler.CreateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      slug:
        maxLength: 220
        type: string
      status:
        description: draft | published
        type: string
      summary:
        maxLength: 500
        type: string
      tag_ids:
        items:
          type: integer
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - content
    - title
    type: object
  handler.CreateCategoryReq:
    properties:
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  handler.CreateCommentReq:
    properties:
      content:
        maxLength: 500
        type: string
      parent_id:
        description: 0 表示一级评论
        type: integer
    required:
    - content
    type: object
  handler.CreateTagReq:
    properties:
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  handler.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterReq:
    properties:
      password:
        minLength: 6
        type: string
      role:
        description: 可选，默认 user
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handler.TokenResp:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.UpdateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      slug:
        maxLength: 220
        type: string
      status:
        type: string
      summary:
        maxLength: 500
        type: string
      tag_ids:
        items:
          type: integer
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - content
    - title
    type: object
  handler.UpdateUserReq:
    properties:
      avatar_url:
        maxLength: 255
        type: string
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  handler.UserResp:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: satiu123
    url: https://github.com/satiu123/GoPalette
  description: 个人博客平台后端 API，基于 Go + Gin + MySQL + Redis
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GoPalette Blog API
  version: "1.0"
paths:
  /admin/articles:
    get:
      description: 管理员分页返回全部文章，含草稿和已发布，支持按分类、标签、作者过滤
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      - description: 分类 ID
        in: query
        name: category_id
        type: integer
      - description: 标签 ID
        in: query
        name: tag_id
        type: integer
      - description: 作者 ID
        in: query
        name: author_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 管理员获取所有文章
      tags:
      - admin
  /admin/comments:
    get:
      description: 分页返回全部评论，含文章标题和评论者信息
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 管理员获取所有评论
      tags:
      - admin
  /articles:
    get:
      description: 公开接口，支持按分类、标签过滤和分页
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页条数（默认 10，最大 50）
        in: query
        name: page_size
        type: integer
      - description: 分类 ID
        in: query
        name: category_id
        type: integer
      - description: 标签 ID
        in: query
        name: tag_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 文章分页列表
      tags:
      - articles
    post:
      consumes:
      - application/json
      description: 登录用户发布文章（draft 或 published）
      parameters:
      - description: 文章内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - articles
  /articles/{id}:
    delete:
      description: 仅作者或 admin 可操作
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - articles
    get:
      description: 按 ID 获取文章，同时自动自增阅读数
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取文章详情
      tags:
      - articles
    put:
      consumes:
      - application/json
      description: 仅作者或 admin 可操作
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - articles
  /articles/{id}/comments:
    get:
      description: 按文章 ID 获取所有评论（支持嵌套回复）
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取文章评论
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: 已登录用户或匿名访客均可评论；登录用户评论会关联账号，匿名评论显示「匿名用户」
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCommentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 发表评论
      tags:
      - comments
  /articles/mine:
    get:
      description: 登录用户查看自己的文章列表，含草稿和已发布
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      - description: 状态过滤（draft 或 published）
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 我的文章分页列表
      tags:
      - articles
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取所有分类
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: 分类名称
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建分类
      tags:
      - categories
  /categories/{id}:
    delete:
      parameters:
      - description: 分类 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - categories
  /comments/{id}:
    delete:
      description: 评论本人或 admin 可删除
      parameters:
      - description: 评论 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除评论
      tags:
      - comments
  /comments/mine:
    get:
      description: 分页返回当前登录用户发表的评论，含文章标题和评论时间
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取我的评论
      tags:
      - comments
  /comments/received:
    get:
      description: 分页返回当前登录用户文章收到的评论，含文章标题、评论者信息和评论时间
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取收到的评论
      tags:
      - comments
  /login:
    post:
      consumes:
      - application/json
      description: 返回 Access Token 和 Refresh Token
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.TokenResp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: 使用 Refresh Token 获取新的双令牌（运用轮转机制）
      parameters:
      - description: Refresh Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.TokenResp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 Token
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: 创建新用户账号
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - auth
  /search:
    get:
      description: 基于 MySQL FULLTEXT 索引（倒排索引原理）搜索文章标题和正文
      parameters:
      - description: 搜索关键词
        in: query
        name: q
        required: true
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 全文搜索
      tags:
      - search
  /tags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取所有标签
      tags:
      - tags
    post:
      consumes:
      - application/json
      parameters:
      - description: 标签名称
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTagReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建标签
      tags:
      - tags
  /tags/{id}:
    delete:
      parameters:
      - description: 标签 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除标签
      tags:
      - tags
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传图片文件（JPEG/PNG/WebP/GIF），单张 ≤ 5MB，返回可访问 URL
      parameters:
      - description: 图片文件
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 上传图片
      tags:
      - upload
  /users/me:
    get:
      consumes:
      - application/json
      description: 需要携带 Access Token，返回用户基本信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.UserResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 可修改用户名；修改密码时需提供旧密码
      parameters:
      - description: 更新信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 修改个人信息
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: JWT Access Token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
